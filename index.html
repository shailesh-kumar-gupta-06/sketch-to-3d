<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch to 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<header>
  <h1>Sketch to 3D</h1>
  <p>Draw a rough object or upload a sketch. Get a 3D model you can download as .glb.</p>
</header>
<main>
  <section class="panel" aria-label="Sketch">
    <div class="tools">
      <button id="brush" class="active" type="button">Brush</button>
      <button id="eraser" type="button">Eraser</button>
      <label class="size">Size <input id="size" type="range" min="2" max="40" value="6"></label>
      <button id="reset" type="button">Reset</button>
      <label class="btn">Upload image<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
    </div>
    <canvas id="pad" width="768" height="768"></canvas>
    <label class="prompt">Describe it (optional)
      <input id="prompt" type="text" maxlength="200" placeholder="e.g. wooden chair, dark brown, glossy">
    </label>
    <button id="go" class="go" type="button">Generate 3D model</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section class="panel" aria-label="3D model">
    <div class="viewer-wrap">
      <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" alt="Generated 3D model"></model-viewer>
      <p id="empty">Your 3D model appears here. Drag to rotate, scroll to zoom.</p>
    </div>
    <div class="tools">
      <a id="dl" class="btn disabled" download="model.glb" aria-disabled="true">Download .glb</a>
      <img id="refined" alt="Refined image used for 3D" hidden>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
